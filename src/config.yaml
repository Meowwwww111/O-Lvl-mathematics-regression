data_path: data/regression_bonus_practice_data.csv
target_column: final_test
random_state: 42
test_size: 0.20
cv_folds: 5
weak_student_threshold: 50

drop_columns:
  - index
  - student_id

categorical_features:
  - direct_admission
  - CCA
  - learning_style
  - gender
  - tuition
  - mode_of_transport
  - bag_color

numeric_features:
  - number_of_siblings
  - n_male
  - n_female
  - age
  - hours_per_week
  - attendance_rate
  - sleep_minutes
  - wake_minutes
  - sleep_duration_hours

models:
  random_forest:
    n_estimators: 400
    max_depth: null
    min_samples_leaf: 2
    max_features: sqrt
  extra_trees:
    n_estimators: 400
    max_depth: null
    min_samples_leaf: 2
    max_features: sqrt
  gradient_boosting:
    n_estimators: 250
    learning_rate: 0.03
    max_depth: 2
    min_samples_leaf: 3
    loss: squared_error
