data_path: data/regression_bonus_practice_data.csv
target_column: final_test
random_state: 42
test_size: 0.15
validation_size: 0.15
cv_folds: 5
weak_student_threshold: 50.0

# These fields are retained for reporting but never supplied to the estimator.
id_column: student_id
drop_columns:
  - index
  - bag_color

categorical_features:
  - direct_admission
  - CCA
  - learning_style
  - gender
  - tuition
  - mode_of_transport

numeric_features:
  - number_of_siblings
  - n_male
  - n_female
  - class_size
  - age
  - hours_per_week
  - attendance_rate
  - sleep_duration_hours
  - sleep_time_sin
  - sleep_time_cos
  - wake_time_sin
  - wake_time_cos

model_grids:
  ridge:
    regressor__alpha: [0.1, 1.0, 10.0, 100.0]
  random_forest:
    regressor__n_estimators: [250]
    regressor__max_depth: [null, 12]
    regressor__min_samples_leaf: [1, 3]
    regressor__max_features: [sqrt, 0.8]
  gradient_boosting:
    regressor__n_estimators: [150, 300]
    regressor__learning_rate: [0.03, 0.07]
    regressor__max_depth: [2, 3]
    regressor__min_samples_leaf: [2]
